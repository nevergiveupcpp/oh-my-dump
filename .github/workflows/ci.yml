name: CI

on:
  push:
    tags: ["v*"]
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-format:
    name: Run Clang-Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install clang-format 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          find idaplugin \( -name "*.h" -o -name "*.cpp" \) | \
          xargs clang-format-22 --dry-run --Werror

  clang-tidy:
    name: Run Clang-Tidy
    runs-on: ubuntu-24.04

    env:
      BUILD_PRESET: linux-x86-64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout IDA SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: HexRaysSA/ida-sdk
          path: .ci/ida-sdk

      - name: Install clang-tidy 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get update
          sudo apt-get install -y clang-tidy-19

      - name: Prepare vcpkg
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" fetch origin "$baseline"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset "$BUILD_PRESET" \
            "-DIDA_SDK_DIR=$GITHUB_WORKSPACE/.ci/ida-sdk" \
            "-DCMAKE_CXX_CLANG_TIDY=clang-tidy-19;--header-filter=.*idaplugin/.*"

      - name: Run clang-tidy
        run: cmake --build --preset "$BUILD_PRESET" --config Release --parallel

  build:
    name: Build / ${{ matrix.platform }}
    needs: [clang-format, clang-tidy]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            preset: windows-x86-64

          - platform: windows-aarch64
            runner: windows-2022
            preset: windows-arm64

          - platform: linux-x86_64
            runner: ubuntu-24.04
            preset: linux-x86-64

          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            preset: linux-arm64

          - platform: macos-x86_64
            runner: macos-15-intel
            preset: macos-x86-64

          - platform: macos-aarch64
            runner: macos-15
            preset: macos-arm64

    runs-on: ${{ matrix.runner }}

    env:
      BUILD_PRESET: ${{ matrix.preset }}
      PLUGIN_PLATFORM: ${{ matrix.platform }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $metadata = Get-Content -Raw ida-plugin.json | ConvertFrom-Json
          $version = $metadata.plugin.version

          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag must match metadata version: v$version"
          }

          $header = Get-Content -Raw idaplugin/version.h
          $match = [regex]::Match(
            $header,
            '(?m)^#define\s+PLUGIN_VERSION\s+"([^"]+)"'
          )

          if (!$match.Success -or $match.Groups[1].Value -cne $version) {
            throw "PLUGIN_VERSION must match metadata version: $version"
          }

      - name: Checkout IDA SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: HexRaysSA/ida-sdk
          path: .ci/ida-sdk

      - name: Prepare vcpkg
        run: |
          if ($IsMacOS) {
            $env:VCPKG_INSTALLATION_ROOT = "/usr/local/share/vcpkg"
          }

          $manifest = Get-Content -Raw vcpkg.json | ConvertFrom-Json
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin $manifest.'builtin-baseline'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake --preset "$env:BUILD_PRESET" `
            "-DIDA_SDK_DIR=$env:GITHUB_WORKSPACE/.ci/ida-sdk"

      - name: Build
        run: cmake --build --preset "$env:BUILD_PRESET" --config Release --parallel

      - name: Package
        run: |
          cmake --install "build/$env:BUILD_PRESET" --config Release --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Get-ChildItem -LiteralPath package -File

          New-Item -ItemType Directory -Force package/docs/images | Out-Null
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $metadata = Get-Content -Raw ida-plugin.json | ConvertFrom-Json
          $metadata.plugin.platforms = @($env:PLUGIN_PLATFORM)

          $metadata | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 package/ida-plugin.json
          Copy-Item LICENSE package/
          Copy-Item docs/images/omd-logo.png package/docs/images/

          $version = $metadata.plugin.version
          $archive = "artifacts/$($metadata.plugin.name)-v$version-$($env:PLUGIN_PLATFORM).zip"
          Compress-Archive -Path package/* -DestinationPath $archive
          Copy-Item $binary.FullName "artifacts/$($metadata.plugin.name)-$($env:PLUGIN_PLATFORM)$($binary.Extension)"
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate plugin archive
        run: |
          python -m pip install ida-hcli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          hcli plugin lint "$env:RELEASE_ARCHIVE"

      - name: Upload plugin assets
        uses: actions/upload-artifact@v7
        with:
          name: oh-my-dump-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download plugin assets
        uses: actions/download-artifact@v8
        with:
          pattern: oh-my-dump-*
          merge-multiple: true
          path: artifacts

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --verify-tag \
            --title "Oh My Dump $GITHUB_REF_NAME for IDA Pro 9.x" \
            --generate-notes